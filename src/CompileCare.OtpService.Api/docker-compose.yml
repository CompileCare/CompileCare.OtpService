services:
  otp-api:
    build:
      context: .  # Current directory (CompileCare.OtpService.Api)
      dockerfile: Dockerfile  # Dockerfile in same directory
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: "redis:6379"
    networks:
      - otp-network

  redis:
    image: redis:7.2-alpine
    container_name: otp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - otp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  otp-network:
    driver: bridge